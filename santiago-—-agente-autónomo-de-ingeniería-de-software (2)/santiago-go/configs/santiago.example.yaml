# SANTIAGO AI SOFTWARE ENGINEERING AGENT
# Configuration specification for Windows PC & Local Ollama
# Compliance: 100% Local-first, AV-friendly, Loopback-only firewall

agent:
  name: "Santiago"
  version: "0.1.0-alpha.phase0"
  log_level: "info"
  operating_mode: "SUPERVISED" # Options: STRICT, SUPERVISED, AUTONOMOUS_VERIFIED
  default_permission: "ANALYZE" # Safe default

network:
  bind_address: "127.0.0.1" # STRICT: Never 0.0.0.0 (prevents Windows Firewall warnings)
  port: 34820
  timeout_seconds: 120
  enable_tls: false # Loopback only, no external exposure

model_router:
  default_provider: "ollama"
  ollama:
    base_url: "http://127.0.0.1:11434"
    model: "qwen2.5-coder:7b"
    fallback_model: "deepseek-coder:6.7b"
    context_window: 16384
    temperature: 0.2
    top_p: 0.95
    seed: 42
  cost_control:
    max_tokens_per_task: 64000
    daily_token_budget: 1000000
    enforce_halt_on_budget: true

memory:
  storage_type: "sqlite"
  sqlite_path: "%APPDATA%/Santiago/santiago_memory.db"
  wal_mode: true
  cache_size_kb: 32768
  vector_search_enabled: true
  embedding_model: "nomic-embed-text"

security:
  command_policy: "STRICT_WHITELIST"
  enforce_user_confirmation_on_risk: "MEDIUM"
  require_snapshot_before_modify: true
  antivirus_mode: "COMPATIBLE"
  block_temp_execution: true
  windows_as_invoker: true # app.manifest execution level

projects_dir: "C:/Projects"
audit_ledger_path: "%APPDATA%/Santiago/audit_ledger.jsonl"
